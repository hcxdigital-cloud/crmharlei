const KEY='leadflow_crm_v1';const stages=['Novo Lead','Contatado','Em Negociação','Proposta Enviada','Fechado','Perdido'];
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>({id:String(x.id||x['Place ID']||('lead-'+crypto.randomUUID())),name:String(x.name||x['Nome da Empresa']||x['Nome Completo']||'Sem nome'),phone:String(x.phone||x['Número de Telefone']||''),web:String(x.web||x.Website||''),category:String(x.category||x.Categoria||''),rating:Number(x.rating??x['Classificação (Estrelas)']??0),reviews:Number(x.reviews??x['Número de Avaliações']??0),address:String(x.address||x.Endereço||''),maps:String(x.maps||x['Link Google Maps']||''),status:stages.includes(x.status)?x.status:'Novo Lead',next:String(x.next||''),notes:String(x.notes||''),history:Array.isArray(x.history)?x.history:[],updated:Number(x.updated||0)});
let leads;try{const saved=JSON.parse(localStorage.getItem(KEY));leads=Array.isArray(saved)?saved.map(norm):SEED.map(norm)}catch{leads=SEED.map(norm)}let view='leads',editing=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(leads))}catch(e){alert('Armazenamento cheio. Exporte um backup para evitar perda de dados.')}}
function safeUrl(u){try{let url=new URL(u);return ['https:','http:'].includes(url.protocol)?url.href:''}catch{return ''}}
function phoneLink(v){let digits=String(v).replace(/\D/g,'');if(!digits)return '';if(digits.startsWith('00'))digits=digits.slice(2);return 'https://wa.me/'+digits}
function link(u,label){return safeUrl(u)?`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer">${label}</a>`:''}
function render(){ $('metrics').innerHTML=[['Total de leads',leads.length],['Contatados',leads.filter(x=>x.status!=='Novo Lead').length],['Em negociação',leads.filter(x=>['Em Negociação','Proposta Enviada'].includes(x.status)).length],['Fechados',leads.filter(x=>x.status==='Fechado').length]].map(([label,value])=>`<div class="card"><small>${label}</small><div class="metric">${value}</div></div>`).join('');$('statusFilter').innerHTML='<option value="">Todas as etapas</option>'+stages.map(s=>`<option>${esc(s)}</option>`).join('');$('statusFilter').value=window.filterStatus||'';$('fStatus').innerHTML=stages.map(s=>`<option>${esc(s)}</option>`).join('');document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===view));['leads','pipeline','followups'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==view));$('heading').textContent=({leads:'Gestão de leads',pipeline:'Funil de vendas',followups:'Acompanhamentos'})[view];if(view==='leads')renderTable();if(view==='pipeline')renderBoard();if(view==='followups')renderFollowups()}
function renderTable(){let q=$('search').value.toLocaleLowerCase('pt-BR');let arr=leads.filter(x=>(!window.filterStatus||x.status===window.filterStatus)&&[x.name,x.phone,x.category,x.address].some(v=>v.toLocaleLowerCase('pt-BR').includes(q)));let sort=$('sort').value;arr.sort((a,b)=>sort==='rating'?b.rating-a.rating:sort==='reviews'?b.reviews-a.reviews:sort==='recent'?b.updated-a.updated:a.name.localeCompare(b.name));$('tbody').innerHTML=arr.map(x=>`<tr><td><div class="company" data-open="${esc(x.id)}">${esc(x.name)}</div><div class="muted">${esc(x.address)}</div></td><td>${esc(x.phone)}<div class="muted">${link(x.web,'Website')}</div></td><td>${esc(x.category)}</td><td>⭐ ${x.rating||'–'} <span class="muted">(${x.reviews})</span></td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.next||'Não agendado')}</td><td><button class="btn" data-open="${esc(x.id)}">Abrir</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhum lead encontrado.</td></tr>';$('count').textContent=`${arr.length} de ${leads.length} leads`}
function renderBoard(){$('board').innerHTML=stages.map(s=>`<div class="lane"><h3>${esc(s)} · ${leads.filter(x=>x.status===s).length}</h3>${leads.filter(x=>x.status===s).map(x=>`<div class="leadcard" data-open="${esc(x.id)}"><strong>${esc(x.name)}</strong><small>${esc(x.category)}</small><small>${esc(x.phone)}</small></div>`).join('')}</div>`).join('')}
function renderFollowups(){let arr=leads.filter(x=>x.next).sort((a,b)=>a.next.localeCompare(b.next));$('followups').innerHTML=arr.map(x=>`<div class="note" data-open="${esc(x.id)}" style="cursor:pointer"><strong>${esc(x.next)}</strong> · ${esc(x.name)} <span class="pill">${esc(x.status)}</span></div>`).join('')||'<div class="empty">Nenhum acompanhamento agendado. Abra um lead para definir a data.</div>'}
function openLead(id){editing=id;let x=leads.find(a=>a.id===id)||norm({id:'lead-'+crypto.randomUUID()});if(!id)editing=x.id;$('modalTitle').textContent=id?x.name:'Novo lead';[['fName','name'],['fPhone','phone'],['fWeb','web'],['fCategory','category'],['fStatus','status'],['fNext','next'],['fAddress','address'],['fNotes','notes']].forEach(([f,k])=>$(f).value=x[k]||'');$('fInteraction').value='';$('history').innerHTML=x.history.length?x.history.slice().reverse().map(h=>`<div class="note">${esc(h.text)}<br><small>${esc(h.date)}</small></div>`).join(''):'<div class="muted">Nenhuma interação registrada.</div>';$('modalLinks').innerHTML=[link(x.web,'🌐 Website'),link(x.maps,'📍 Google Maps'),link(phoneLink(x.phone),'💬 WhatsApp')].filter(Boolean).join(' &nbsp; ');$('deleteBtn').style.visibility=id?'visible':'hidden';$('overlay').classList.add('show')}
$('saveBtn').onclick=()=>{let x=leads.find(a=>a.id===editing);if(!x){x=norm({id:editing});leads.push(x)}[['fName','name'],['fPhone','phone'],['fWeb','web'],['fCategory','category'],['fStatus','status'],['fNext','next'],['fAddress','address'],['fNotes','notes']].forEach(([f,k])=>x[k]=$(f).value.trim());if(!x.name){alert('Informe o nome da empresa');return}if($('fInteraction').value.trim())x.history.push({date:new Date().toLocaleString('pt-BR'),text:$('fInteraction').value.trim()});x.updated=Date.now();persist();$('overlay').classList.remove('show');render()};
$('deleteBtn').onclick=()=>{if(confirm('Excluir este lead permanentemente?')){leads=leads.filter(x=>x.id!==editing);persist();$('overlay').classList.remove('show');render()}};$('close').onclick=()=> $('overlay').classList.remove('show');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')};document.addEventListener('click',e=>{let el=e.target.closest('[data-open]');if(el)openLead(el.dataset.open)});document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{view=el.dataset.view;render()});$('search').oninput=renderTable;$('sort').onchange=renderTable;$('statusFilter').onchange=e=>{window.filterStatus=e.target.value;renderTable()};$('newBtn').onclick=()=>openLead(null);
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(!window.XLSX){alert('Para importar Excel, conecte-se à internet para carregar o leitor de planilhas.');return}try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw Error('Planilha vazia');let incoming=rows.map(norm),ids=new Set(leads.map(x=>x.id)),added=0;for(let x of incoming){if(!ids.has(x.id)){leads.push(x);ids.add(x.id);added++}}persist();render();alert(`${added} novos leads importados. ${incoming.length-added} duplicados ignorados.`)}catch(err){alert('Erro ao importar: '+err.message)}e.target.value=''};
$('exportBtn').onclick=()=>{if(!window.XLSX){let blob=new Blob([JSON.stringify(leads,null,2)],{type:'application/json'});download(blob,'backup-crm.json');return}let rows=leads.map(x=>({'Nome da Empresa':x.name,'Número de Telefone':x.phone,Website:x.web,Categoria:x.category,'Classificação (Estrelas)':x.rating,'Número de Avaliações':x.reviews,Endereço:x.address,'Link Google Maps':x.maps,'Place ID':x.id,Status:x.status,'Próximo Contato':x.next,Observações:x.notes,'Histórico':x.history.map(h=>h.date+' - '+h.text).join(' | ')}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');XLSX.writeFile(wb,'crm-leads.xlsx')};function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
